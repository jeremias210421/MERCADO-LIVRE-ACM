{% extends "base.html" %}

{% block title %}Upload de Rotas - ACM Ibotirama{% endblock %}
{% block page_title %}Upload de Rotas{% endblock %}

{% block content %}
<div class="fade-in" style="max-width: 700px;">
    <div class="card-gestor">
        <div class="mb-4">
            <h6 style="font-weight: 700; margin: 0 0 4px;">Importar Rotas via JSON</h6>
            <p style="color: var(--text-muted); font-size: 13px; margin: 0;">
                Selecione um ou mais arquivos JSON de rota para importar.
            </p>
        </div>

        <form method="POST" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-4">
                <label for="files" style="display: block; border: 2px dashed var(--border-light); border-radius: 16px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.3s;" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border-light)'">
                    <i class="bi bi-cloud-upload" style="font-size: 40px; color: var(--accent); display: block; margin-bottom: 12px;"></i>
                    <span style="font-weight: 600; font-size: 14px;">Clique para selecionar arquivos</span>
                    <span style="display: block; font-size: 12px; color: var(--text-muted); margin-top: 4px;">Apenas arquivos .json</span>
                    <input type="file" name="files" id="files" multiple accept=".json" style="display: none;" onchange="document.getElementById('fileNames').textContent = Array.from(this.files).map(f => f.name).join(', ')">
                </label>
                <p id="fileNames" style="font-size: 12px; color: var(--text-secondary); margin-top: 8px;"></p>
            </div>

            <button type="submit" class="btn-accent w-100">
                <i class="bi bi-upload me-2"></i>Importar Rotas
            </button>
        </form>
    </div>
</div>
{% endblock %}
