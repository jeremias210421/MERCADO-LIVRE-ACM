{% extends "base.html" %}

{% block title %}Página não encontrada - ACM Ibotirama{% endblock %}
{% block page_title %}404 - Não Encontrado{% endblock %}

{% block content %}
<div class="fade-in text-center py-5">

    <h2 style="font-weight: 700; margin-bottom: 8px;">Página não encontrada</h2>

{% endblock %}
