name: Looker Full Scan (nuvem, fatiado)

on:
  schedule:
    - cron: '0 2 * * *' # 23:00 BRT todos os dias
  workflow_dispatch:
    inputs:
      pages:
        description: 'Paginas por execucao'
        required: false
        default: '120'

jobs:
  fullscan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r etl/requirements-etl.txt
          playwright install chromium --with-deps

      - name: Run fatia
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_COOKIES: ${{ secrets.GOOGLE_COOKIES }}
          PAGES: ${{ inputs.pages || '120' }}
        run: python etl/looker_full_scan.py
